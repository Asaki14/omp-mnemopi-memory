<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="300" rx="24" fill="#F0EDE5"/>
  <g fill="#272621">
    <text x="500" y="52" font-size="20" font-weight="600" text-anchor="middle">Keep only what is worth remembering</text>
  </g>
  <g stroke="#272621" stroke-width="2" fill="#FFFFFF">
    <rect x="40" y="96" width="200" height="132" rx="16"/>
    <rect x="290" y="96" width="200" height="132" rx="16"/>
    <rect x="540" y="96" width="200" height="132" rx="16"/>
    <rect x="790" y="96" width="170" height="132" rx="16"/>
  </g>
  <g stroke="#272621" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246 162H280M272 154L280 162L272 170"/>
    <path d="M496 162H530M522 154L530 162L522 170"/>
    <path d="M746 162H780M772 154L780 162L772 170"/>
  </g>
  <g fill="#272621" text-anchor="middle">
    <text x="140" y="140" font-size="18" font-weight="600">Session ends</text>
    <text x="140" y="172" font-size="14" fill="#6B675E">Conversation and</text>
    <text x="140" y="192" font-size="14" fill="#6B675E">ask selections</text>
    <text x="390" y="140" font-size="18" font-weight="600">Distill</text>
    <text x="390" y="172" font-size="14" fill="#6B675E">Evidence-checked,</text>
    <text x="390" y="192" font-size="14" fill="#6B675E">secrets filtered</text>
    <text x="640" y="140" font-size="18" font-weight="600">/memories</text>
    <text x="640" y="172" font-size="14" fill="#6B675E">Review, edit,</text>
    <text x="640" y="192" font-size="14" fill="#6B675E">or delete anytime</text>
    <text x="875" y="140" font-size="18" font-weight="600">Next request</text>
    <text x="875" y="172" font-size="14" fill="#6B675E">Ranked and fit</text>
    <text x="875" y="192" font-size="14" fill="#6B675E">to context</text>
  </g>
  <text x="500" y="268" font-size="14" fill="#6B675E" text-anchor="middle">Raw transcripts stay archived and never come back as instructions</text>
</svg>
